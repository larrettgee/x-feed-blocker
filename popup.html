<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px 16px; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #0f1419; }
  @media (prefers-color-scheme: dark) { body { background: #15202b; color: #e7e9ea; } }
  h1 { font-size: 16px; margin: 0 0 10px; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; cursor: pointer; }
  label.master { font-weight: 600; border-bottom: 1px solid rgba(128,128,128,.3); padding-bottom: 10px; margin-bottom: 4px; }
  body.disabled label:not(.master) { opacity: .45; }
  p { margin: 10px 0 0; font-size: 12px; opacity: .7; }
</style>
</head>
<body>
  <h1>X Feed Blocker</h1>
  <label class="master">Blocking enabled <input type="checkbox" id="enabled"></label>
  <label>Hide home feed <input type="checkbox" id="home"></label>
  <label>Hide Explore / trends <input type="checkbox" id="explore"></label>
  <label>Sidebar: only Today's News <input type="checkbox" id="sidebar"></label>
  <label>Hide "Discover more" under posts <input type="checkbox" id="discoverMore"></label>
  <p>Posting, notifications, messages, profiles, search and individual posts stay available.</p>
  <script src="popup.js"></script>
</body>
</html>
